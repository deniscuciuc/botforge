version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      telegram:
        patterns: ["Telegram.Bot"]
      messaging:
        patterns: ["MassTransit*", "StackExchange.Redis"]
      observability:
        patterns: ["OpenTelemetry*"]
      roslyn:
        patterns: ["Microsoft.CodeAnalysis*"]
      test-dependencies:
        patterns: ["xunit*", "NSubstitute", "coverlet*", "Testcontainers*", "WireMock.Net", "Microsoft.NET.Test.Sdk", "BenchmarkDotNet"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "docker-compose"
    directory: "/infrastructure"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
