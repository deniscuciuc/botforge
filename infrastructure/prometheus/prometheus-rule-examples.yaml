apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: botforge-telegram-observability-rules
  labels:
    app.kubernetes.io/name: botforge-telegram
spec:
  groups:
    - name: botforge.telegram.messaging
      rules:
        - alert: BotForgeMessagingRetryRateHigh
          expr: sum(rate(botforge_telegram_messaging_retry_attempts_total[5m])) > 5
          for: 10m
          labels:
            severity: warning
            component: messaging
          annotations:
            summary: "High retry rate in messaging pipeline"
            description: "Messaging retry attempts are above 5/sec for 10 minutes. Investigate downstream Telegram/API availability or local throttling behavior."

        - alert: BotForgeMessagingCircuitRejectionsHigh
          expr: sum(rate(botforge_telegram_messaging_circuitbreaker_rejections_total[5m])) > 0.2
          for: 5m
          labels:
            severity: critical
            component: messaging
          annotations:
            summary: "Circuit breaker is actively rejecting sends"
            description: "Circuit breaker rejections exceed 0.2/sec for 5 minutes. Messaging availability is degraded."

    - name: botforge.telegram.routing
      rules:
        - alert: BotForgeRoutingFailureRateHigh
          expr: |
            (
              sum(rate(botforge_telegram_routing_updates_total{status=~"failed|exception"}[5m]))
              /
              clamp_min(sum(rate(botforge_telegram_routing_updates_total[5m])), 1)
            ) > 0.05
          for: 10m
          labels:
            severity: warning
            component: routing
          annotations:
            summary: "Routing failures exceed 5%"
            description: "Routing failure+exception ratio is above 5% for 10 minutes. Check handlers, middleware exceptions, and authorization/rate-limit decisions."
